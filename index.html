<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shadowbound Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090912;color:#fff;font-family:Arial,sans-serif;overflow:hidden;touch-action:none}
#game{display:block;width:100vw;height:100vh;background:linear-gradient(#111124,#07070d)}
#hud{position:fixed;top:12px;left:0;right:0;display:flex;gap:12px;justify-content:space-between;padding:0 14px;pointer-events:none}
.panel{width:42%;text-shadow:0 2px 3px #000}.name{font-weight:800;font-size:14px;margin-bottom:5px}.bar{height:18px;border:2px solid #fff;border-radius:10px;overflow:hidden;background:#252535}.hp{height:100%;background:#d91e1e;width:100%;transition:width .1s}
#center{position:fixed;top:55px;left:0;right:0;text-align:center;font-weight:800;font-size:15px;pointer-events:none}
#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 18px}
.cluster{display:flex;gap:10px}.btn{width:58px;height:58px;border-radius:50%;border:2px solid #777;background:#171727;color:#fff;font-weight:800;font-size:13px;box-shadow:0 4px 12px #0008}.btn:active{background:#3a3a4f;transform:scale(.95)}
#start,#win{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07070ddd;text-align:center;z-index:50;pointer-events:auto}
#start *,#win *{pointer-events:auto}.card{padding:28px;max-width:360px}.title{font-size:40px;font-weight:900;letter-spacing:3px}.sub{opacity:.8;margin:10px 0 22px}.startbtn{padding:14px 24px;border:none;background:#d91e1e;color:#fff;font-weight:800;border-radius:6px;cursor:pointer;margin:8px}.startbtn:hover{background:#ff2e2e}.special{background:#8c5bf1}.special:hover{background:#a974ff}
#win{display:none}.hint{font-size:12px;opacity:.7;margin-top:14px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="panel"><div class="name">VEX</div><div class="bar"><div id="pHp" class="hp"></div></div></div>
  <div class="panel enemy"><div class="name" style="text-align:right">STRIKER</div><div class="bar"><div id="eHp" class="hp"></div></div></div>
</div>
<div id="center">Vex vs Striker</div>
<div id="controls">
 <div class="cluster">
  <button class="btn" id="left">◀</button><button class="btn" id="right">▶</button><button class="btn" id="jump">▲</button>
 </div>
 <div class="cluster">
  <button class="btn attack" id="attack">PUNCH</button><button class="btn special" id="special">SPECIAL</button>
 </div>
</div>
<div id="start"><div class="card"><div class="title">SHADOWBOUND</div><div class="sub">Prototype 1 — VEX vs STRIKER</div>
<div style="margin:12px 0;font-weight:800">CHOOSE YOUR FIGHTER</div>
<div style="display:flex;gap:10px;justify-content:center;margin-bottom:16px">
<button class="startbtn fighter" data-fighter="vex">VEX</button>
<button class="startbtn fighter" data-fighter="striker">STRIKER</button>
</div>
<button class="startbtn" id="startBtn">START FIGHT</button><div class="hint">Move, jump, punch, and charge your special.</div></div></div>
<div id="win"><div class="card"><div class="title" id="result">VICTORY</div><button class="startbtn" id="again">PLAY AGAIN</button></div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);resize();
let running=false,last=0,keys={},particles=[],shake=0,chosen='vex';
let p={x:170,y:0,vx:0,vy:0,hp:100,face:1,on:true,attack:0,special:0,stun:0};
let e={x:innerWidth-170,y:0,vx:0,vy:0,hp:100,face:-1,attack:0,stun:0};
const ground=()=>innerHeight-125;
function reset(){p={x:170,y:ground(),vx:0,vy:0,hp:100,face:1,attack:0,special:0,stun:0};e={x:innerWidth-170,y:ground(),vx:0,vy:0,hp:100,face:-1,attack:0,stun:0};particles=[]}
function burst(x,y,n=14){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.8)*7,life:25+Math.random()*20})}
function hit(attacker,target,dmg){if(target.stun>0)return;target.hp=Math.max(0,target.hp-dmg);target.stun=14;target.vx=attacker.face*5;burst(target.x,target.y-45,12);shake=7}
function doAttack(){if(!running||p.attack>0)return;p.attack=18}
function doSpecial(){if(!running||p.special<100)return;p.special=0;p.attack=34;setTimeout(()=>{if(running&&Math.abs(p.x-e.x)<170)hit(p,e,30)},220);burst(p.x+p.face*35,p.y-50,28)}
function update(dt){
 if(!running)return;
 p.special=Math.min(100,p.special+0.09*dt);
 p.y+=p.vy*dt;p.vy+=.75*dt;if(p.y>=ground()){p.y=ground();p.vy=0;p.on=true}else p.on=false;
 if(p.stun>0)p.stun-=dt;
 if(p.attack>0){p.attack-=dt;if(p.attack<9&&p.attack+dt>=9&&Math.abs(p.x-e.x)<105)hit(p,e,9)}
 let move=(keys.left?-1:0)+(keys.right?1:0); if(p.stun<=0)p.vx+=(move*0.7-p.vx)*.25*dt;p.x+=p.vx*dt;p.x=Math.max(45,Math.min(innerWidth-45,p.x));if(move)p.face=move;
 // Simple AI
 if(e.stun>0)e.stun-=dt;
 let dx=p.x-e.x, ad=Math.abs(dx); e.face=dx>=0?1:-1;
 if(e.stun<=0){e.vx+=(ad>95?e.face*.55:-e.vx*.35)*dt;e.x+=e.vx*dt;if(ad<105&&e.attack<=0)e.attack=28}
 if(e.attack>0){e.attack-=dt;if(e.attack<10&&e.attack+dt>=10&&ad<105)hit(e,p,7)}
 e.x=Math.max(45,Math.min(innerWidth-45,e.x));
 if(p.hp<=0||e.hp<=0){running=false;document.getElementById('result').textContent=e.hp<=0?'VICTORY':'DEFEAT';document.getElementById('win').style.display='flex'}
 document.getElementById('pHp').style.width=p.hp+'%';document.getElementById('eHp').style.width=e.hp+'%';
}
function drawFighter(o,label,enemy=false){
 ctx.save();ctx.translate(o.x,o.y);ctx.scale(o.face,1);
 // shadow
 ctx.globalAlpha=.3;ctx.beginPath();ctx.ellipse(0,5,35,8,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 // body
 ctx.fillStyle=enemy?'#b72d42':'#6f39d8';ctx.fillRect(-18,-72,36,48);
 ctx.fillStyle='#d7a27c';ctx.beginPath();ctx.arc(0,-88,15,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#111';ctx.fillRect(-13,-102,26,9);
 // legs
 ctx.strokeStyle='#20202d';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(-9,-24);ctx.lineTo(-13,2);ctx.moveTo(9,-24);ctx.lineTo(13,2);ctx.stroke();
 // arms / attack
 ctx.strokeStyle=enemy?'#d84b5c':'#8c5bf1';ctx.lineWidth=9;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(-16,-60);ctx.lineTo(-29,-38);ctx.stroke();
 ctx.beginPath();ctx.moveTo(16,-60);ctx.lineTo(o.attack>0?42:28,o.attack>0?-62:-38);ctx.stroke();
 if(!enemy&&o.attack>0){ctx.strokeStyle='#d7a8ff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(48,-62,14,0,Math.PI*2);ctx.stroke()}
 ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText(label,0,28);
 ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,innerWidth,innerHeight);
 let s=shake?((Math.random()-.5)*shake):0; if(shake>0)shake-=1;
 ctx.save();ctx.translate(s,0);
 // arena
 ctx.fillStyle='#101022';ctx.fillRect(0,ground()+5,innerWidth,120);
 ctx.strokeStyle='#33334c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,ground()+5);ctx.lineTo(innerWidth,ground()+5);ctx.stroke();
 for(let x=0;x<innerWidth;x+=70){ctx.strokeStyle='#17172a';ctx.beginPath();ctx.moveTo(x,ground()+5);ctx.lineTo(x+35,innerHeight);ctx.stroke()}
 drawFighter(p,'VEX');drawFighter(e,'STRIKER',true);
 particles.forEach(q=>{ctx.globalAlpha=Math.max(0,q.life/40);ctx.fillStyle='#d99cff';ctx.fillRect(q.x,q.y,4,4);q.x+=q.vx;q.y+=q.vy;q.vy+=.25;q.life--});ctx.globalAlpha=1;
 particles=particles.filter(q=>q.life>0);ctx.restore();
}
function loop(t){let dt=Math.min(2,(t-last)/16.67||1);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function bind(id,prop){let b=document.getElementById(id);['pointerdown','touchstart'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[prop]=true}));['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{keys[prop]=false}))}
bind('left','left');bind('right','right');
document.getElementById('jump').onclick=()=>{if(p.on){p.vy=-13;p.on=false}}
document.getElementById('attack').onclick=doAttack;document.getElementById('special').onclick=doSpecial;
document.querySelectorAll('.fighter').forEach(b=>b.addEventListener('click',()=>{chosen=b.dataset.fighter}));
function startGame(){reset(); if(chosen==='striker'){let old=p;p=e;e=old;p.face=-1;e.face=1} running=true;document.getElementById('start').style.display='none'}
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('again').onclick=()=>{reset();running=true;document.getElementById('win').style.display='none'};
addEventListener('keydown',ev=>{if(ev.key==='ArrowLeft')keys.left=true;if(ev.key==='ArrowRight')keys.right=true;if(ev.key==='ArrowUp')document.getElementById('jump').click();if(ev.key===' ')doAttack()});
addEventListener('keyup',ev=>{if(ev.key==='ArrowLeft')keys.left=false;if(ev.key==='ArrowRight')keys.right=false});
</script>
</body></html>
