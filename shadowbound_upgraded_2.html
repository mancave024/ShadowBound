<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shadowbound</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:0;background:#090912;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:100}
#start-menu{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1a2e;border:3px solid #8f42ff;border-radius:12px;padding:30px;width:90%;max-width:500px;text-align:center;z-index:200;pointer-events:auto}
#start-menu h1{font-size:36px;margin:0 0 10px 0;color:#fff}
#start-menu p{margin:5px 0;font-size:14px;opacity:.8}
.fighter-list{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:20px 0}
.fighter-btn{padding:10px;background:#2a2a4e;border:2px solid #666;color:#fff;cursor:pointer;border-radius:6px;font-weight:bold;font-size:11px;transition:all .2s}
.fighter-btn:hover{background:#3a3a5e;border-color:#8f42ff}
.fighter-btn.active{background:#8f42ff;border-color:#8f42ff}
.diff-list{display:flex;gap:10px;justify-content:center;margin:15px 0}
.diff-btn{padding:10px 16px;background:#8f42ff;border:0;color:#fff;cursor:pointer;border-radius:6px;font-weight:bold;transition:all .2s}
.diff-btn:hover{background:#a855ff}
.diff-btn.inactive{opacity:.5}
#start-btn{width:100%;padding:16px;background:#8f42ff;border:0;color:#fff;font-size:18px;font-weight:bold;cursor:pointer;border-radius:6px;margin-top:15px;transition:all .2s}
#start-btn:hover{background:#a855ff}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;font-size:12px;z-index:10}
.hp-bar{width:200px;height:20px;background:#2a2a2a;border:2px solid #fff;border-radius:4px;overflow:hidden;margin-top:5px}
.hp-fill{height:100%;background:#00ff00;width:100%;transition:width .2s}
.sp-fill{background:#b85cff}
#win-screen{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1a2e;border:3px solid #8f42ff;border-radius:12px;padding:30px;width:90%;max-width:400px;text-align:center;z-index:200;pointer-events:auto;display:none}
#win-screen h1{font-size:40px;margin:0}
#replay-btn{width:100%;padding:16px;background:#8f42ff;border:0;color:#fff;font-size:18px;font-weight:bold;cursor:pointer;border-radius:6px;margin-top:15px}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div id="start-menu">
    <h1>SHADOWBOUND</h1>
    <p>Full Roster - Pick Your Fighter</p>
    <div class="fighter-list" id="fighters"></div>
    <p style="margin-top:20px;margin-bottom:8px">Difficulty:</p>
    <div class="diff-list">
      <button class="diff-btn inactive" data-diff="easy">EASY</button>
      <button class="diff-btn" data-diff="normal">NORMAL</button>
      <button class="diff-btn inactive" data-diff="hard">HARD</button>
    </div>
    <button id="start-btn">START FIGHT</button>
  </div>
  
  <div id="hud" style="display:none">
    <div>
      <div id="p-name">PLAYER</div>
      <div class="hp-bar"><div id="p-hp" class="hp-fill"></div></div>
      <div class="hp-bar"><div id="p-sp" class="hp-fill sp-fill"></div></div>
    </div>
    <div style="text-align:right">
      <div id="e-name">ENEMY</div>
      <div class="hp-bar"><div id="e-hp" class="hp-fill"></div></div>
      <div class="hp-bar"><div id="e-sp" class="hp-fill sp-fill"></div></div>
    </div>
  </div>
  
  <div id="win-screen">
    <h1 id="result">VICTORY</h1>
    <p id="result-text" style="margin:10px 0;font-size:16px">You win!</p>
    <button id="replay-btn">PLAY AGAIN</button>
  </div>
</div>

<script>
// FIGHTERS DATA
const FIGHTERS={
  vex:{name:'VEX',color:'#6330c8',hp:100,speed:.52,dmg:7},
  striker:{name:'STRIKER',color:'#9d263b',hp:100,speed:.52,dmg:7},
  nova:{name:'NOVA',color:'#ff6b35',hp:95,speed:.68,dmg:8},
  frost:{name:'FROST',color:'#00bfff',hp:105,speed:.45,dmg:6},
  apex:{name:'APEX',color:'#00ff00',hp:110,speed:.50,dmg:7},
  phantom:{name:'PHANTOM',color:'#9d4edd',hp:90,speed:.75,dmg:8},
  titan:{name:'TITAN',color:'#ff6b6b',hp:120,speed:.40,dmg:9},
  wraith:{name:'WRAITH',color:'#a0aec0',hp:92,speed:.70,dmg:8},
  cipher:{name:'CIPHER',color:'#667eea',hp:98,speed:.55,dmg:7},
  inferno:{name:'INFERNO',color:'#ff2d2d',hp:88,speed:.80,dmg:9}
};

// SETUP
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
let chosenFighter='vex',difficulty='normal',gameRunning=false;
let player,enemy,particles=[],shake=0,keys={};

function resizeCanvas(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

// FIGHTER CLASS
class Fighter{
  constructor(x,name,isEnemy=false){
    const data=FIGHTERS[name];
    this.x=x;
    this.y=canvas.height-120;
    this.name=name;
    this.displayName=data.name;
    this.color=data.color;
    this.hp=data.hp;
    this.maxHp=data.hp;
    this.special=0;
    this.vx=this.vy=0;
    this.speed=data.speed;
    this.dmg=data.dmg;
    this.attack=0;
    this.stun=0;
    this.onGround=true;
    this.isEnemy=isEnemy;
  }
  
  draw(){
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.fillStyle=this.color;
    ctx.fillRect(-15,-40,30,40);
    ctx.fillStyle='#fff';
    ctx.font='10px Arial';
    ctx.textAlign='center';
    ctx.fillText(this.displayName,0,15);
    ctx.restore();
  }
  
  update(){
    this.vy+=0.6;
    this.y+=this.vy;
    if(this.y>=canvas.height-120){
      this.y=canvas.height-120;
      this.vy=0;
      this.onGround=true;
    }else{
      this.onGround=false;
    }
    
    if(this.stun>0)this.stun--;
    if(this.attack>0)this.attack--;
    this.special=Math.min(100,this.special+0.08);
    
    this.x=Math.max(20,Math.min(canvas.width-20,this.x));
  }
}

// PARTICLE CLASS
class Particle{
  constructor(x,y,vx,vy,color){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.life=30;this.color=color;
  }
  update(){this.vy+=0.2;this.x+=this.vx;this.y+=this.vy;this.life--}
  draw(){ctx.globalAlpha=this.life/30;ctx.fillStyle=this.color;ctx.fillRect(this.x,this.y,3,3)}
}

function burst(x,y,color){
  for(let i=0;i<12;i++){
    particles.push(new Particle(x,y,(Math.random()-0.5)*6,(Math.random()-0.5)*6,color));
  }
}

function startGame(){
  const oppName=Object.keys(FIGHTERS)[Math.floor(Math.random()*10)];
  player=new Fighter(100,chosenFighter);
  enemy=new Fighter(canvas.width-100,oppName,true);
  particles=[];
  gameRunning=true;
  document.getElementById('start-menu').style.display='none';
  document.getElementById('hud').style.display='flex';
  document.getElementById('win-screen').style.display='none';
}

function gameOver(won){
  gameRunning=false;
  document.getElementById('hud').style.display='none';
  document.getElementById('win-screen').style.display='block';
  document.getElementById('result').textContent=won?'VICTORY':'DEFEAT';
  document.getElementById('result-text').textContent=won?player.displayName+' WINS!':enemy.displayName+' WINS!';
}

function update(){
  if(!gameRunning)return;
  
  player.update();
  enemy.update();
  
  if(player.stun<=0){
    if(keys.left)player.x-=player.speed*2;
    if(keys.right)player.x+=player.speed*2;
    if(keys.jump&&player.onGround){player.vy=-12;player.onGround=false;keys.jump=false}
    if(keys.attack&&!player.attack){player.attack=20;shake=3}
  }
  
  let dx=enemy.x-player.x;
  if(Math.abs(dx)<120&&Math.abs(player.y-enemy.y)<80){
    if(player.attack>0){
      enemy.hp-=player.dmg;
      enemy.stun=8;
      burst(enemy.x,enemy.y,player.color);
      gameRunning&&(enemy.hp<=0)&&gameOver(true);
    }
  }
  
  if(enemy.stun<=0&&Math.random()<0.02){
    enemy.x+=(dx>0?1:-1)*enemy.speed*2;
    if(Math.random()<0.1&&enemy.onGround){enemy.vy=-12;enemy.onGround=false}
    if(Math.random()<0.03&&!enemy.attack){enemy.attack=20}
  }
  
  if(enemy.attack>0){
    let edx=player.x-enemy.x;
    if(Math.abs(edx)<120&&Math.abs(player.y-enemy.y)<80){
      player.hp-=enemy.dmg;
      player.stun=8;
      burst(player.x,player.y,enemy.color);
      gameRunning&&(player.hp<=0)&&gameOver(false);
    }
  }
  
  particles=particles.filter(p=>{p.update();return p.life>0});
  
  document.getElementById('p-hp').style.width=(player.hp/player.maxHp*100)+'%';
  document.getElementById('e-hp').style.width=(enemy.hp/FIGHTERS[enemy.name].hp*100)+'%';
  document.getElementById('p-sp').style.width=player.special+'%';
  document.getElementById('e-sp').style.width=enemy.special+'%';
  document.getElementById('p-name').textContent=player.displayName;
  document.getElementById('e-name').textContent=enemy.displayName;
}

function draw(){
  ctx.fillStyle='#090912';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  
  ctx.fillStyle='#1a1a2e';
  ctx.fillRect(0,canvas.height-120,canvas.width,120);
  
  if(gameRunning){
    player.draw();
    enemy.draw();
    particles.forEach(p=>p.draw());
  }
  ctx.globalAlpha=1;
}

function gameLoop(){
  update();
  draw();
  requestAnimationFrame(gameLoop);
}
gameLoop();

// UI SETUP
Object.keys(FIGHTERS).forEach(key=>{
  const btn=document.createElement('button');
  btn.className='fighter-btn'+(key==='vex'?' active':'');
  btn.textContent=FIGHTERS[key].name;
  btn.onclick=function(){
    document.querySelectorAll('.fighter-btn').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    chosenFighter=key;
  };
  document.getElementById('fighters').appendChild(btn);
});

document.querySelectorAll('.diff-btn').forEach(btn=>{
  btn.onclick=function(){
    document.querySelectorAll('.diff-btn').forEach(b=>b.classList.add('inactive'));
    this.classList.remove('inactive');
    difficulty=this.dataset.diff;
  };
});

document.getElementById('start-btn').onclick=startGame;
document.getElementById('replay-btn').onclick=()=>location.reload();

// KEYBOARD
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')keys.left=true;
  if(e.key==='ArrowRight')keys.right=true;
  if(e.key==='ArrowUp')keys.jump=true;
  if(e.key===' ')keys.attack=true;
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft')keys.left=false;
  if(e.key==='ArrowRight')keys.right=false;
  if(e.key==='ArrowUp')keys.jump=false;
  if(e.key===' ')keys.attack=false;
});
</script>
</body></html>
