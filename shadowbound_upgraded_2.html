<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shadowbound</title>
<style>
* { box-sizing: border-box; }
body { 
  margin: 0; 
  padding: 0; 
  background: #090912; 
  color: #fff; 
  font-family: Arial, sans-serif; 
  overflow: hidden;
}
canvas { 
  display: block; 
  width: 100%; 
  height: 100%;
  background: linear-gradient(180deg, #111124, #07070d);
}
#menu-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
#menu-card {
  background: #1a1a2e;
  border: 3px solid #8f42ff;
  border-radius: 12px;
  padding: 30px;
  width: 90%;
  max-width: 600px;
  text-align: center;
  box-shadow: 0 0 20px rgba(143, 66, 255, 0.5);
}
#menu-card h1 {
  font-size: 40px;
  margin: 0 0 10px 0;
  color: #fff;
  text-transform: uppercase;
  letter-spacing: 2px;
}
#menu-card .subtitle {
  font-size: 14px;
  margin: 0 0 20px 0;
  opacity: 0.7;
}
.label {
  margin: 15px 0 10px 0;
  font-weight: bold;
  font-size: 14px;
  text-transform: uppercase;
}
.fighter-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
  gap: 8px;
  margin: 15px 0;
  max-height: 200px;
  overflow-y: auto;
  padding: 10px;
}
.fighter-btn {
  padding: 12px 8px;
  background: #2a2a4e;
  border: 2px solid #666;
  color: #fff;
  cursor: pointer;
  border-radius: 6px;
  font-weight: bold;
  font-size: 12px;
  transition: all 0.2s;
  text-transform: uppercase;
  word-break: break-word;
}
.fighter-btn:hover {
  background: #3a3a5e;
  border-color: #8f42ff;
  transform: scale(1.05);
}
.fighter-btn.selected {
  background: #8f42ff;
  border-color: #8f42ff;
  box-shadow: 0 0 10px #8f42ff;
}
.fighter-btn.pete {
  border-color: #ff1744;
}
.fighter-btn.pete.selected {
  background: #ff1744;
  border-color: #ff1744;
  box-shadow: 0 0 10px #ff1744;
}
.diff-row {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin: 15px 0;
  flex-wrap: wrap;
}
.diff-btn {
  padding: 10px 20px;
  background: #2a2a4e;
  border: 2px solid #666;
  color: #fff;
  cursor: pointer;
  border-radius: 6px;
  font-weight: bold;
  font-size: 13px;
  transition: all 0.2s;
  text-transform: uppercase;
}
.diff-btn:hover {
  border-color: #8f42ff;
  transform: scale(1.05);
}
.diff-btn.active {
  background: #8f42ff;
  border-color: #8f42ff;
  box-shadow: 0 0 10px #8f42ff;
}
#play-btn {
  width: 100%;
  padding: 18px;
  background: #8f42ff;
  border: 0;
  color: #fff;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  border-radius: 6px;
  margin-top: 20px;
  transition: all 0.3s;
  text-transform: uppercase;
  letter-spacing: 1px;
}
#play-btn:hover {
  background: #a855ff;
  transform: scale(1.02);
  box-shadow: 0 0 15px #8f42ff;
}
#play-btn:active {
  transform: scale(0.98);
}
#hud {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  display: none;
  justify-content: space-between;
  font-size: 12px;
  z-index: 10;
  gap: 20px;
}
.stats-panel {
  background: rgba(26,26,46,0.8);
  padding: 10px;
  border-radius: 6px;
  min-width: 200px;
}
.stats-panel.enemy {
  text-align: right;
}
.fighter-name {
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 5px;
  text-transform: uppercase;
}
.bar {
  height: 16px;
  background: #2a2a2a;
  border: 1px solid #fff;
  border-radius: 3px;
  overflow: hidden;
  margin: 3px 0;
}
.bar-fill {
  height: 100%;
  background: #00ff00;
  transition: width 0.15s;
}
.bar-fill.special {
  background: #b85cff;
}
.bar-fill.crisis {
  background: #ff1744;
}
#win-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1001;
}
#win-card {
  background: #1a1a2e;
  border: 3px solid #8f42ff;
  border-radius: 12px;
  padding: 40px;
  width: 90%;
  max-width: 500px;
  text-align: center;
  box-shadow: 0 0 20px rgba(143, 66, 255, 0.5);
}
#win-card h1 {
  font-size: 50px;
  margin: 0;
  text-transform: uppercase;
  letter-spacing: 2px;
}
#win-text {
  font-size: 18px;
  margin: 15px 0;
}
#replay-btn {
  width: 100%;
  padding: 16px;
  background: #8f42ff;
  border: 0;
  color: #fff;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  border-radius: 6px;
  margin-top: 20px;
  text-transform: uppercase;
}
#replay-btn:hover {
  background: #a855ff;
}
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="menu-overlay">
  <div id="menu-card">
    <h1>⚡ SHADOWBOUND ⚡</h1>
    <p class="subtitle">Select Your Fighter</p>
    
    <div class="label">fighters</div>
    <div class="fighter-grid" id="fighters"></div>
    
    <div class="label">difficulty</div>
    <div class="diff-row" id="difficulties"></div>
    
    <button id="play-btn">▶ START FIGHT</button>
  </div>
</div>

<div id="win-overlay">
  <div id="win-card">
    <h1 id="result">VICTORY</h1>
    <p id="win-text">You win!</p>
    <button id="replay-btn">PLAY AGAIN</button>
  </div>
</div>

<div id="hud">
  <div class="stats-panel">
    <div class="fighter-name" id="p-name">PLAYER</div>
    <div class="bar"><div id="p-hp" class="bar-fill"></div></div>
    <div class="bar"><div id="p-sp" class="bar-fill special"></div></div>
    <div id="p-crisis" style="display:none;font-size:11px;margin-top:5px">
      CRISIS: <span id="p-crisis-val">0</span>%
    </div>
  </div>
  
  <div class="stats-panel enemy">
    <div class="fighter-name" id="e-name">ENEMY</div>
    <div class="bar"><div id="e-hp" class="bar-fill"></div></div>
    <div class="bar"><div id="e-sp" class="bar-fill special"></div></div>
    <div id="e-crisis" style="display:none;font-size:11px;margin-top:5px">
      CRISIS: <span id="e-crisis-val">0</span>%
    </div>
  </div>
</div>

<script>
// FIGHTERS
const FIGHTERS = {
  vex: { name: 'VEX', color: '#6330c8', hp: 100, speed: 0.52, dmg: 7 },
  striker: { name: 'STRIKER', color: '#9d263b', hp: 100, speed: 0.52, dmg: 7 },
  nova: { name: 'NOVA', color: '#ff6b35', hp: 95, speed: 0.68, dmg: 8 },
  frost: { name: 'FROST', color: '#00bfff', hp: 105, speed: 0.45, dmg: 6 },
  apex: { name: 'APEX', color: '#00ff00', hp: 110, speed: 0.50, dmg: 7 },
  phantom: { name: 'PHANTOM', color: '#9d4edd', hp: 90, speed: 0.75, dmg: 8 },
  titan: { name: 'TITAN', color: '#ff6b6b', hp: 120, speed: 0.40, dmg: 9 },
  wraith: { name: 'WRAITH', color: '#a0aec0', hp: 92, speed: 0.70, dmg: 8 },
  cipher: { name: 'CIPHER', color: '#667eea', hp: 98, speed: 0.55, dmg: 7 },
  inferno: { name: 'INFERNO', color: '#ff2d2d', hp: 88, speed: 0.80, dmg: 9 },
  peteb: { name: 'PETE B 🥊', color: '#ff1744', hp: 130, speed: 0.60, dmg: 10, crisis: true }
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let chosen = 'vex';
let difficulty = 'normal';
let gameRunning = false;
let player, enemy;
let particles = [];
let keys = {};

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Fighter {
  constructor(x, id, isEnemy) {
    const data = FIGHTERS[id];
    this.x = x;
    this.y = canvas.height - 120;
    this.id = id;
    this.name = data.name;
    this.color = data.color;
    this.hp = data.hp;
    this.maxHp = data.hp;
    this.vx = 0;
    this.vy = 0;
    this.speed = data.speed;
    this.dmg = data.dmg;
    this.attack = 0;
    this.stun = 0;
    this.isEnemy = isEnemy;
    this.onGround = true;
    this.special = 0;
    this.crisis = data.crisis ? 0 : -1;
    this.battleTime = 0;
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    ctx.fillStyle = this.color;
    ctx.fillRect(-15, -40, 30, 40);
    
    if(this.crisis >= 0 && this.crisis > 50) {
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 3;
      ctx.globalAlpha = this.crisis / 100;
      ctx.strokeRect(-20, -45, 40, 50);
    }
    
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 9px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(this.name, 0, 12);
    
    ctx.restore();
  }

  update() {
    this.vy += 0.6;
    this.y += this.vy;
    
    if(this.y >= canvas.height - 120) {
      this.y = canvas.height - 120;
      this.vy = 0;
      this.onGround = true;
    } else {
      this.onGround = false;
    }
    
    if(this.stun > 0) this.stun--;
    if(this.attack > 0) this.attack--;
    this.special = Math.min(100, this.special + 0.08);
    
    if(this.crisis >= 0) {
      this.battleTime++;
      this.crisis = Math.min(100, this.battleTime * 0.1);
    }
    
    this.x = Math.max(20, Math.min(canvas.width - 20, this.x));
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 6;
    this.vy = (Math.random() - 0.5) * 6;
    this.color = color;
    this.life = 30;
  }

  update() {
    this.vy += 0.2;
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
  }

  draw() {
    ctx.globalAlpha = this.life / 30;
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, 3, 3);
  }
}

function startGame() {
  const opponents = Object.keys(FIGHTERS);
  const oppId = opponents[Math.floor(Math.random() * opponents.length)];
  
  player = new Fighter(100, chosen, false);
  enemy = new Fighter(canvas.width - 100, oppId, true);
  particles = [];
  gameRunning = true;
  
  document.getElementById('menu-overlay').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  
  if(player.crisis >= 0) document.getElementById('p-crisis').style.display = 'block';
  if(enemy.crisis >= 0) document.getElementById('e-crisis').style.display = 'block';
}

function gameOver(won) {
  gameRunning = false;
  document.getElementById('hud').style.display = 'none';
  document.getElementById('win-overlay').style.display = 'flex';
  document.getElementById('result').textContent = won ? 'VICTORY' : 'DEFEAT';
  document.getElementById('win-text').textContent = won ? player.name + ' WINS!' : enemy.name + ' WINS!';
}

function update() {
  if(!gameRunning) return;
  
  player.update();
  enemy.update();
  
  // Player
  if(player.stun <= 0) {
    if(keys.left) player.x -= player.speed * 2;
    if(keys.right) player.x += player.speed * 2;
    if(keys.jump && player.onGround) {
      player.vy = -12;
      player.onGround = false;
      keys.jump = false;
    }
    if(keys.attack && !player.attack) {
      let dmg = player.dmg;
      if(player.crisis >= 100) dmg *= 1.5;
      
      player.attack = 20;
      
      let dx = enemy.x - player.x;
      if(Math.abs(dx) < 120 && Math.abs(player.y - enemy.y) < 80) {
        enemy.hp = Math.max(0, enemy.hp - dmg);
        enemy.stun = 8;
        particles.push(new Particle(enemy.x, enemy.y, player.color));
        if(enemy.hp <= 0) gameOver(true);
      }
    }
  }
  
  // Enemy AI
  if(enemy.stun <= 0 && Math.random() < 0.02) {
    let targetX = player.x;
    if(enemy.crisis >= 100) {
      targetX = player.x + (Math.random() - 0.5) * 60;
    }
    enemy.x += (targetX > enemy.x ? 1 : -1) * enemy.speed * 2;
    
    if(Math.random() < 0.1 && enemy.onGround) {
      enemy.vy = -12;
      enemy.onGround = false;
    }
    if(Math.random() < 0.03 && !enemy.attack) {
      let dmg = enemy.dmg;
      if(enemy.crisis >= 100) dmg *= 1.5;
      
      enemy.attack = 20;
      
      let dx = player.x - enemy.x;
      if(Math.abs(dx) < 120 && Math.abs(player.y - enemy.y) < 80) {
        player.hp = Math.max(0, player.hp - dmg);
        player.stun = 8;
        particles.push(new Particle(player.x, player.y, enemy.color));
        if(player.hp <= 0) gameOver(false);
      }
    }
  }
  
  particles = particles.filter(p => { p.update(); return p.life > 0; });
  
  const pData = FIGHTERS[player.id];
  const eData = FIGHTERS[enemy.id];
  
  document.getElementById('p-hp').style.width = (player.hp / pData.hp * 100) + '%';
  document.getElementById('e-hp').style.width = (enemy.hp / eData.hp * 100) + '%';
  document.getElementById('p-sp').style.width = player.special + '%';
  document.getElementById('e-sp').style.width = enemy.special + '%';
  document.getElementById('p-name').textContent = player.name;
  document.getElementById('e-name').textContent = enemy.name;
  
  if(player.crisis >= 0) document.getElementById('p-crisis-val').textContent = Math.floor(player.crisis);
  if(enemy.crisis >= 0) document.getElementById('e-crisis-val').textContent = Math.floor(enemy.crisis);
}

function draw() {
  ctx.fillStyle = '#090912';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, canvas.height - 120, canvas.width, 120);
  
  if(gameRunning) {
    player.draw();
    enemy.draw();
    particles.forEach(p => p.draw());
  }
  ctx.globalAlpha = 1;
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}
gameLoop();

// UI SETUP - FIGHTERS
const fightersContainer = document.getElementById('fighters');
Object.keys(FIGHTERS).forEach(key => {
  const btn = document.createElement('button');
  btn.className = 'fighter-btn' + (key === 'peteb' ? ' pete' : '') + (key === chosen ? ' selected' : '');
  btn.textContent = FIGHTERS[key].name;
  btn.onclick = function() {
    document.querySelectorAll('.fighter-btn').forEach(b => b.classList.remove('selected'));
    this.classList.add('selected');
    chosen = key;
  };
  fightersContainer.appendChild(btn);
});

// UI SETUP - DIFFICULTY
const diffContainer = document.getElementById('difficulties');
['easy', 'normal', 'hard'].forEach(d => {
  const btn = document.createElement('button');
  btn.className = 'diff-btn' + (d === difficulty ? ' active' : '');
  btn.textContent = d.toUpperCase();
  btn.onclick = function() {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    difficulty = d;
  };
  diffContainer.appendChild(btn);
});

document.getElementById('play-btn').onclick = startGame;
document.getElementById('replay-btn').onclick = () => location.reload();

// KEYBOARD
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowLeft') keys.left = true;
  if(e.key === 'ArrowRight') keys.right = true;
  if(e.key === 'ArrowUp') keys.jump = true;
  if(e.key === ' ') keys.attack = true;
});

document.addEventListener('keyup', e => {
  if(e.key === 'ArrowLeft') keys.left = false;
  if(e.key === 'ArrowRight') keys.right = false;
  if(e.key === 'ArrowUp') keys.jump = false;
  if(e.key === ' ') keys.attack = false;
});
</script>

</body>
</html>
