<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shadowbound</title>
<style>
* { box-sizing: border-box; }
html, body { 
  margin: 0; 
  padding: 0; 
  width: 100%;
  height: 100%;
  background: #090912; 
  color: #fff; 
  font-family: Arial, sans-serif; 
  overflow: hidden;
  touch-action: none;
}
canvas { 
  display: block; 
  width: 100vw; 
  height: 100vh;
  background: linear-gradient(180deg, #111124, #07070d);
}
#menu { 
  position: fixed; 
  top: 0; 
  left: 0; 
  width: 100%; 
  height: 100%; 
  background: rgba(0,0,0,0.95);
  display: flex; 
  align-items: center; 
  justify-content: center; 
  z-index: 1000;
  pointer-events: all;
}
#menu.hidden { display: none; }
#card { 
  background: #1a1a2e; 
  border: 3px solid #00ff00; 
  border-radius: 12px; 
  padding: 25px; 
  width: 95%; 
  max-width: 700px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
  pointer-events: all;
}
h1 { 
  font-size: 36px; 
  margin: 0 0 8px 0; 
  text-transform: uppercase; 
  letter-spacing: 2px;
  color: #00ff00;
}
.subtitle { 
  font-size: 13px; 
  margin: 0 0 15px 0; 
  opacity: 0.7;
}
.section { 
  margin: 15px 0;
}
.label { 
  font-weight: bold; 
  font-size: 12px; 
  text-transform: uppercase; 
  margin-bottom: 8px;
  color: #00ff00;
}
.grid { 
  display: grid; 
  grid-template-columns: repeat(auto-fit, minmax(65px, 1fr)); 
  gap: 6px;
}
.fighter-btn { 
  padding: 10px 6px; 
  background: #2a2a4e; 
  border: 2px solid #00aa00; 
  color: #fff; 
  cursor: pointer; 
  border-radius: 6px; 
  font-weight: bold; 
  font-size: 11px; 
  transition: all 0.2s;
  text-transform: uppercase;
  pointer-events: all;
}
.fighter-btn:hover { 
  background: #3a3a5e; 
  border-color: #00ff00;
  box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
}
.fighter-btn.active { 
  background: #00ff00; 
  border-color: #00ff00;
  color: #000;
  box-shadow: 0 0 15px rgba(0, 255, 0, 0.8);
}
.row { 
  display: flex; 
  gap: 8px; 
  justify-content: center; 
  flex-wrap: wrap;
  margin: 10px 0;
}
.diff-btn { 
  padding: 10px 16px; 
  background: #2a2a4e; 
  border: 2px solid #00aa00; 
  color: #fff; 
  cursor: pointer; 
  border-radius: 6px; 
  font-weight: bold; 
  font-size: 12px; 
  transition: all 0.2s;
  text-transform: uppercase;
  pointer-events: all;
}
.diff-btn:hover { 
  border-color: #00ff00;
  box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
}
.diff-btn.active { 
  background: #00ff00; 
  border-color: #00ff00;
  color: #000;
  box-shadow: 0 0 15px rgba(0, 255, 0, 0.8);
}
#play-btn { 
  width: 100%; 
  padding: 16px; 
  background: #00ff00; 
  border: 0; 
  color: #000; 
  font-size: 16px; 
  font-weight: bold; 
  cursor: pointer; 
  border-radius: 6px; 
  margin-top: 15px; 
  transition: all 0.3s;
  text-transform: uppercase;
  box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
  pointer-events: all;
}
#play-btn:hover { 
  background: #00dd00;
  box-shadow: 0 0 30px rgba(0, 255, 0, 0.8);
}
#play-btn:active { 
  transform: scale(0.98); 
}
#hud { 
  position: fixed; 
  top: 10px; 
  left: 10px; 
  right: 10px; 
  display: none; 
  justify-content: space-between; 
  z-index: 10;
  pointer-events: none;
}
.stats { 
  background: rgba(26,26,46,0.9); 
  padding: 10px; 
  border-radius: 6px; 
  min-width: 180px;
  border: 2px solid #00ff00;
}
.stats.right { 
  text-align: right; 
}
.name { 
  font-weight: bold; 
  font-size: 12px; 
  margin-bottom: 5px;
  color: #00ff00;
}
.bar { 
  height: 12px; 
  background: #2a2a2a; 
  border: 1px solid #00ff00; 
  border-radius: 2px; 
  overflow: hidden; 
  margin: 2px 0;
}
.fill { 
  height: 100%; 
  background: #00ff00; 
  transition: width 0.15s;
}
.fill.sp { 
  background: #00dd00;
}
#controls {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  gap: 10px;
  z-index: 10;
  pointer-events: all;
}
.control-btn {
  width: 60px;
  height: 60px;
  background: #00ff00;
  border: 2px solid #00ff00;
  color: #000;
  font-weight: bold;
  border-radius: 50%;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.1s;
  user-select: none;
  touch-action: none;
}
.control-btn:active {
  background: #00dd00;
  transform: scale(0.9);
}
#win { 
  position: fixed; 
  top: 0; 
  left: 0; 
  width: 100%; 
  height: 100%; 
  background: rgba(0,0,0,0.95); 
  display: none; 
  align-items: center; 
  justify-content: center; 
  z-index: 1001;
  pointer-events: all;
}
#win.show { 
  display: flex; 
}
#result-card { 
  background: #1a1a2e; 
  border: 3px solid #00ff00; 
  border-radius: 12px; 
  padding: 40px; 
  text-align: center;
  box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
  pointer-events: all;
}
#result-card h1 { 
  font-size: 48px; 
  margin: 0;
  color: #00ff00;
}
#result-card p { 
  font-size: 16px; 
  margin: 15px 0;
}
#replay-btn { 
  width: 100%; 
  padding: 14px; 
  background: #00ff00; 
  border: 0; 
  color: #000; 
  font-size: 16px; 
  font-weight: bold; 
  cursor: pointer; 
  border-radius: 6px; 
  margin-top: 15px;
  text-transform: uppercase;
  box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
  pointer-events: all;
}
#replay-btn:hover {
  background: #00dd00;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="menu">
  <div id="card">
    <h1>⚡ SHADOWBOUND ⚡</h1>
    <p class="subtitle">Select Your Fighter</p>
    
    <div class="section">
      <div class="label">Choose Fighter</div>
      <div class="grid" id="fighters"></div>
    </div>
    
    <div class="section">
      <div class="label">Difficulty</div>
      <div class="row" id="diffs"></div>
    </div>
    
    <button id="play-btn">▶ START FIGHT</button>
  </div>
</div>

<div id="hud">
  <div class="stats">
    <div class="name" id="pname">PLAYER</div>
    <div class="bar"><div id="php" class="fill"></div></div>
    <div class="bar"><div id="psp" class="fill sp"></div></div>
  </div>
  <div class="stats right">
    <div class="name" id="ename">ENEMY</div>
    <div class="bar"><div id="ehp" class="fill"></div></div>
    <div class="bar"><div id="esp" class="fill sp"></div></div>
  </div>
</div>

<div id="controls">
  <button class="control-btn" id="left-btn">◀</button>
  <button class="control-btn" id="jump-btn">▲</button>
  <button class="control-btn" id="right-btn">▶</button>
  <button class="control-btn" id="attack-btn" style="width: 80px; height: 80px; font-size: 24px;">🥊</button>
</div>

<div id="win">
  <div id="result-card">
    <h1 id="result">VICTORY</h1>
    <p id="wtext">You win!</p>
    <button id="replay-btn">PLAY AGAIN</button>
  </div>
</div>

<script>
const FIGHTERS = {
  vex: { name: 'VEX', color: '#00ff00', hp: 100, spd: 0.52, dmg: 7 },
  striker: { name: 'STRIKER', color: '#00dd00', hp: 100, spd: 0.52, dmg: 7 },
  nova: { name: 'NOVA', color: '#00cc00', hp: 95, spd: 0.68, dmg: 8 },
  frost: { name: 'FROST', color: '#00bb00', hp: 105, spd: 0.45, dmg: 6 },
  apex: { name: 'APEX', color: '#00aa00', hp: 110, spd: 0.50, dmg: 7 },
  phantom: { name: 'PHANTOM', color: '#009900', hp: 90, spd: 0.75, dmg: 8 },
  titan: { name: 'TITAN', color: '#008800', hp: 120, spd: 0.40, dmg: 9 },
  wraith: { name: 'WRAITH', color: '#007700', hp: 92, spd: 0.70, dmg: 8 },
  cipher: { name: 'CIPHER', color: '#00ff44', hp: 98, spd: 0.55, dmg: 7 },
  inferno: { name: 'INFERNO', color: '#00ff66', hp: 88, spd: 0.80, dmg: 9 },
  peteb: { name: 'PETE B', color: '#00ff00', hp: 130, spd: 0.60, dmg: 10 }
};

const cv = document.getElementById('canvas');
const ctx = cv.getContext('2d');

let chosen = 'vex', diff = 'normal', running = false;
let p, e, particles = [], keys = {};

function resize() { 
  cv.width = innerWidth; 
  cv.height = innerHeight; 
}
resize();
window.addEventListener('resize', resize);

class Fighter {
  constructor(x, id, isEnemy = false) {
    const d = FIGHTERS[id];
    this.x = x;
    this.y = cv.height - 120;
    this.id = id;
    this.name = d.name;
    this.color = d.color;
    this.hp = d.hp;
    this.maxHp = d.hp;
    this.vx = 0;
    this.vy = 0;
    this.spd = d.spd;
    this.dmg = d.dmg;
    this.atk = 0;
    this.stun = 0;
    this.grounded = true;
    this.sp = 0;
    this.isEnemy = isEnemy;
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(0, -30, 15, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillRect(-10, -15, 20, 25);
    
    ctx.beginPath();
    ctx.moveTo(-10, -10);
    ctx.lineTo(-25, -20);
    ctx.lineTo(-20, -5);
    ctx.fill();
    
    ctx.beginPath();
    ctx.moveTo(10, -10);
    ctx.lineTo(25, -20);
    ctx.lineTo(20, -5);
    ctx.fill();
    
    ctx.fillRect(-8, 10, 6, 15);
    ctx.fillRect(2, 10, 6, 15);
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(this.name, 0, 35);
    
    ctx.restore();
  }

  update() {
    this.vy += 0.6;
    this.y += this.vy;
    
    if (this.y >= cv.height - 120) {
      this.y = cv.height - 120;
      this.vy = 0;
      this.grounded = true;
    } else {
      this.grounded = false;
    }
    
    if (this.stun > 0) this.stun--;
    if (this.atk > 0) this.atk--;
    this.sp = Math.min(100, this.sp + 0.08);
    this.x = Math.max(30, Math.min(cv.width - 30, this.x));
  }
}

class Particle {
  constructor(x, y, c) {
    this.x = x;
    this.y = y;
    this.c = c;
    this.vx = (Math.random() - 0.5) * 8;
    this.vy = (Math.random() - 0.5) * 8;
    this.life = 30;
  }

  update() {
    this.vy += 0.2;
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
  }

  draw() {
    ctx.globalAlpha = this.life / 30;
    ctx.fillStyle = this.c;
    ctx.fillRect(this.x - 2, this.y - 2, 4, 4);
  }
}

function checkHit(a1, a2) {
  const dx = Math.abs(a1.x - a2.x);
  const dy = Math.abs(a1.y - a2.y);
  return dx < 100 && dy < 80;
}

function startGame() {
  const oppList = Object.keys(FIGHTERS);
  const opp = oppList[Math.floor(Math.random() * oppList.length)];
  
  p = new Fighter(100, chosen, false);
  e = new Fighter(cv.width - 100, opp, true);
  particles = [];
  running = true;
  
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('controls').style.display = 'flex';
}

function endGame(won) {
  running = false;
  document.getElementById('hud').style.display = 'none';
  document.getElementById('controls').style.display = 'none';
  document.getElementById('win').classList.add('show');
  document.getElementById('result').textContent = won ? 'VICTORY!' : 'DEFEAT!';
  document.getElementById('wtext').textContent = won ? p.name + ' WINS! 🎉' : e.name + ' WINS!';
}

function updateGame() {
  if (!running) return;

  p.update();
  e.update();

  if (p.stun <= 0) {
    if (keys.left) p.x -= p.spd * 2.5;
    if (keys.right) p.x += p.spd * 2.5;
    if (keys.jump && p.grounded) {
      p.vy = -14;
      p.grounded = false;
    }
    if (keys.attack && !p.atk) {
      p.atk = 20;
      if (checkHit(p, e)) {
        e.hp -= p.dmg;
        e.stun = 8;
        for (let i = 0; i < 5; i++) {
          particles.push(new Particle(e.x, e.y - 30, p.color));
        }
        if (e.hp <= 0) endGame(true);
      }
    }
  }

  if (e.stun <= 0) {
    const dist = Math.abs(e.x - p.x);
    
    if (dist > 80) {
      e.x += (p.x > e.x ? 1 : -1) * e.spd * 2;
    }
    
    if (Math.random() < 0.01 && e.grounded) {
      e.vy = -14;
      e.grounded = false;
    }
    
    if (Math.random() < 0.02 && !e.atk) {
      e.atk = 20;
      if (checkHit(e, p)) {
        p.hp -= e.dmg;
        p.stun = 8;
        for (let i = 0; i < 5; i++) {
          particles.push(new Particle(p.x, p.y - 30, e.color));
        }
        if (p.hp <= 0) endGame(false);
      }
    }
  }

  particles = particles.filter(q => {
    q.update();
    return q.life > 0;
  });

  document.getElementById('pname').textContent = p.name;
  document.getElementById('ename').textContent = e.name;
  document.getElementById('php').style.width = Math.max(0, p.hp / p.maxHp * 100) + '%';
  document.getElementById('ehp').style.width = Math.max(0, e.hp / e.maxHp * 100) + '%';
  document.getElementById('psp').style.width = p.sp + '%';
  document.getElementById('esp').style.width = e.sp + '%';
}

function drawGame() {
  ctx.fillStyle = '#090912';
  ctx.fillRect(0, 0, cv.width, cv.height);
  
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, cv.height - 120, cv.width, 120);
  
  ctx.strokeStyle = '#00ff00';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, cv.height - 120);
  ctx.lineTo(cv.width, cv.height - 120);
  ctx.stroke();

  if (running) {
    p.draw();
    e.draw();
    particles.forEach(q => q.draw());
  }
  
  ctx.globalAlpha = 1;
}

function gameLoop() {
  updateGame();
  drawGame();
  requestAnimationFrame(gameLoop);
}
gameLoop();

const fg = document.getElementById('fighters');
Object.keys(FIGHTERS).forEach(k => {
  const b = document.createElement('button');
  b.className = 'fighter-btn' + (k === chosen ? ' active' : '');
  b.textContent = FIGHTERS[k].name;
  b.type = 'button';
  b.onclick = () => {
    document.querySelectorAll('.fighter-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    chosen = k;
  };
  fg.appendChild(b);
});

const dd = document.getElementById('diffs');
['easy', 'normal', 'hard'].forEach(d => {
  const b = document.createElement('button');
  b.className = 'diff-btn' + (d === diff ? ' active' : '');
  b.textContent = d.toUpperCase();
  b.type = 'button';
  b.onclick = () => {
    document.querySelectorAll('.diff-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    diff = d;
  };
  dd.appendChild(b);
});

document.getElementById('play-btn').onclick = startGame;
document.getElementById('replay-btn').onclick = () => location.reload();

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') keys.left = true;
  if (e.key === 'ArrowRight') keys.right = true;
  if (e.key === 'ArrowUp') keys.jump = true;
  if (e.key === ' ') { keys.attack = true; e.preventDefault(); }
});

document.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft') keys.left = false;
  if (e.key === 'ArrowRight') keys.right = false;
  if (e.key === 'ArrowUp') keys.jump = false;
  if (e.key === ' ') keys.attack = false;
});

document.getElementById('left-btn').addEventListener('pointerdown', () => keys.left = true);
document.getElementById('left-btn').addEventListener('pointerup', () => keys.left = false);
document.getElementById('right-btn').addEventListener('pointerdown', () => keys.right = true);
document.getElementById('right-btn').addEventListener('pointerup', () => keys.right = false);
document.getElementById('jump-btn').addEventListener('pointerdown', () => keys.jump = true);
document.getElementById('jump-btn').addEventListener('pointerup', () => keys.jump = false);
document.getElementById('attack-btn').addEventListener('pointerdown', () => keys.attack = true);
document.getElementById('attack-btn').addEventListener('pointerup', () => keys.attack = false);
</script>

</body>
</html>
